name: CI

on:
  push:
    branches: [feature/multi-program-compliance-platform, main]
  pull_request:
    branches: [feature/multi-program-compliance-platform, main]

jobs:
  quality-gate:
    name: Prohibited-reference scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Scan current tracked files for prohibited automated-generation-tool references
        run: bash scripts/scan-prohibited-references.sh

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    needs: quality-gate
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: qiyas_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, gd, zip, intl
      - name: Install dependencies (locked versions only, no interactive network resolution)
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Dependency vulnerability audit
        run: composer audit
      - name: Configure environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: qiyas_ci
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: php artisan migrate --force
      - name: Run test suite
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: qiyas_ci
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: php artisan test
